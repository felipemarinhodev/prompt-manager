pre-commit:
  commands:
    check:
      run: npm format {staged_files}
      glob: '*.{js,jsx,mjs,ts,tsx,css,json,md}'
      stage_fixed: true
    validate:
      glob: '*.{ts,tsx}'
      run: npm typecheck

pre-push:
  commands:
    validate:
      glob: '*.{ts,tsx}'
      run: npm typecheck
    lint:
      glob: '*.{ts,tsx}'
      run: npm lint
    test:
      glob: '*.{ts,tsx}'
      run: npm test:coverage
